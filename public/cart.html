<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Moto Marketplace</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .cart-page {
            background-color: var(--bg-primary);
            min-height: 100vh;
        }

        .cart-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .cart-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            background-color: var(--bg-secondary);
            padding: 1rem;
            border-radius: 12px;
        }

        .cart-item-image {
            width: 150px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            background: linear-gradient(135deg, #1a4a3a, #0d2820);
            flex-shrink: 0;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-details {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cart-item-name {
            font-size: 1.1rem;
            font-weight: 600;
            min-width: 150px;
        }

        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--bg-card);
            padding: 0.5rem;
            border-radius: 8px;
        }

        .cart-qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background-color: var(--bg-secondary);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-qty-btn:hover {
            background-color: var(--bg-card-hover);
        }

        .cart-qty-value {
            min-width: 30px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-pricing {
            text-align: right;
        }

        .cart-item-price {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-yellow);
            margin-bottom: 0.25rem;
        }

        .cart-item-cashback {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--accent-green);
        }

        .cart-item-remove {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.25rem;
            padding: 0.5rem;
        }

        .cart-summary {
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-size: 1rem;
            color: var(--text-primary);
        }

        .summary-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .cashback-row {
            background-color: rgba(245, 158, 11, 0.1);
            margin: 0 -1.5rem;
            padding: 1rem 1.5rem;
        }

        .cashback-row .summary-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-yellow);
        }

        .cashback-row .summary-value {
            color: var(--accent-green);
        }

        .total-row .summary-label {
            font-weight: 600;
        }

        .total-row .summary-value {
            font-size: 1.25rem;
            color: var(--accent-yellow);
        }

        .btn-checkout {
            width: 100%;
            padding: 1rem;
            background-color: var(--accent-yellow);
            color: var(--bg-primary);
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s;
        }

        .btn-checkout:hover {
            background-color: var(--accent-orange);
        }

        .empty-cart {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-cart-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .empty-cart h2 {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .empty-cart a {
            color: var(--accent-yellow);
        }

        @media (max-width: 768px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item-details {
                flex-direction: column;
                align-items: flex-start;
                width: 100%;
            }

            .cart-item-pricing {
                text-align: left;
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>
<body class="cart-page">
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <img src="/assets/icons/navbar_logo.png" alt="Moto Logo">
            <span class="nav-brand-text">Moto Marketplace</span>
        </a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/marketplace">Marketplace</a>
            <a href="/search">Search</a>
            <a href="/tools">Services</a>
            <span id="auth-links"></span>
        </div>
        <div class="nav-user" id="user-section" style="display: none;" onclick="toggleUserDropdown(event)">
            <div class="nav-user-avatar">👤</div>
            <div class="nav-user-info">
                <div class="nav-user-greeting">Good Morning 👋</div>
                <div class="nav-user-name" id="nav-username">Motor Hub User</div>
            </div>
            <div class="nav-user-dropdown" id="user-dropdown">
                <a href="/profile">👤 Profile</a>
                <a href="/dashboard">📊 Dashboard</a>
                <a href="/cart">🛒 My Cart</a>
                <div class="dropdown-divider"></div>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
    </nav>

    <div class="cart-container">
        <h1 class="cart-title">Shopping Cart</h1>

        <div class="cart-items" id="cart-items">
        </div>

        <div class="cart-summary" id="cart-summary">
            <div class="summary-row">
                <span class="summary-label">Subtotal</span>
                <span class="summary-value" id="subtotal">₸ 0</span>
            </div>
            <div class="summary-row cashback-row">
                <span class="summary-label">🎁 Total cashback</span>
                <span class="summary-value" id="total-cashback">₸ 0</span>
            </div>
            <div class="summary-row total-row">
                <span class="summary-label">Total</span>
                <span class="summary-value" id="total">₸ 0</span>
            </div>
            <button class="btn-checkout" onclick="proceedToCheckout()">Proceed to Checkout</button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-bottom">
            © Moto Market. All rights reserved.
        </div>
    </footer>

    <script src="/js/auth.js"></script>
    <script>
        let cart = JSON.parse(localStorage.getItem('motoCart')) || [];

        if (cart.length === 0) {
            cart = [{
                id: 5,
                name: 'BMW C400X',
                price: 15800000,
                cashback: 7200,
                quantity: 1,
                image: '/assets/slider/slider_img3.png'
            }];
            localStorage.setItem('motoCart', JSON.stringify(cart));
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            const summaryContainer = document.getElementById('cart-summary');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <h2>Your cart is empty</h2>
                        <p>Browse our <a href="/marketplace">marketplace</a> to find great deals!</p>
                    </div>
                `;
                summaryContainer.style.display = 'none';
                return;
            }

            summaryContainer.style.display = 'block';

            container.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="cart-item-image">
                        <img src="${item.image || '/assets/slider/slider_img3.png'}" alt="${item.name}">
                    </div>
                    <div class="cart-item-details">
                        <span class="cart-item-name">${item.name}</span>
                        <div class="cart-item-qty">
                            <button class="cart-qty-btn" onclick="updateQty(${index}, -1)">−</button>
                            <span class="cart-qty-value">${item.quantity}</span>
                            <button class="cart-qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                    <div class="cart-item-pricing">
                        <div class="cart-item-price">₸ ${(item.price * item.quantity).toLocaleString()}</div>
                        <div class="cart-item-cashback">🎁 ₸ ${(item.cashback * item.quantity).toLocaleString()} cashback</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeItem(${index})">🗑️</button>
                </div>
            `).join('');

            updateSummary();
        }

        function updateQty(index, delta) {
            cart[index].quantity = Math.max(1, cart[index].quantity + delta);
            localStorage.setItem('motoCart', JSON.stringify(cart));
            renderCart();
        }

        function removeItem(index) {
            cart.splice(index, 1);
            localStorage.setItem('motoCart', JSON.stringify(cart));
            renderCart();
        }

        function updateSummary() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const cashback = cart.reduce((sum, item) => sum + (item.cashback * item.quantity), 0);

            document.getElementById('subtotal').textContent = '₸ ' + subtotal.toLocaleString();
            document.getElementById('total-cashback').textContent = '₸ ' + cashback.toLocaleString();
            document.getElementById('total').textContent = '₸ ' + subtotal.toLocaleString();
        }

        function proceedToCheckout() {
            alert('Proceeding to checkout...\nTotal: ₸ ' + cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toLocaleString());
        }

        function toggleUserDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('user-dropdown');
            dropdown.classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('user-dropdown');
            const userSection = document.getElementById('user-section');
            if (dropdown && !userSection.contains(e.target)) {
                dropdown.classList.remove('active');
            }
        });

        function logout() {
            fetch('/api/logout', { method: 'POST' })
                .then(() => window.location.href = '/login');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            renderCart();

            const authData = await checkAuth();
            if (authData.isAuthenticated) {
                document.getElementById('user-section').style.display = 'flex';
                document.getElementById('nav-username').textContent = authData.user.username;
            }
        });
    </script>
</body>
</html>
